services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: alfa-app:latest
    container_name: alfa_app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - ./:/var/www
      - vendor:/var/www/vendor
      - dashboard_storage:/var/www/storage
    environment:
      APP_NAME: "${APP_NAME:-Alfa colaborador inteligente}"
      APP_ENV: "${APP_ENV:-production}"
      APP_KEY: "${APP_KEY}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_URL: "${APP_URL:-http://localhost:8080}"

      # Cache & Queue
      CACHE_DRIVER: "${CACHE_DRIVER:-file}"
      QUEUE_CONNECTION: "${QUEUE_CONNECTION:-sync}"
      SESSION_DRIVER: "${SESSION_DRIVER:-file}"

      # ----------------------------------------------------------------
      # Conexión MySQL/MariaDB (opcional)
      # ----------------------------------------------------------------
      DB_SAE_CONNECTION: "${DB_SAE_CONNECTION:-mysql}"
      DB_SAE_HOST: "${DB_SAE_HOST:-}"
      DB_SAE_PORT: "${DB_SAE_PORT:-3306}"
      DB_SAE_DATABASE: "${DB_SAE_DATABASE:-}"
      DB_SAE_USERNAME: "${DB_SAE_USERNAME:-}"
      DB_SAE_PASSWORD: "${DB_SAE_PASSWORD:-}"
      DB_SAE_CHARSET: "${DB_SAE_CHARSET:-utf8mb4}"
      DB_SAE_COLLATION: "${DB_SAE_COLLATION:-utf8mb4_unicode_ci}"

      # ----------------------------------------------------------------
      # Conexión PostgreSQL — contenedor alfa_postgres
      # (Credenciales centralizadas desde .env)
      # ----------------------------------------------------------------
      DB_PG_HOST: "${DB_PG_HOST:-alfa_postgres}"
      DB_PG_PORT: "${DB_PG_PORT:-5432}"
      DB_PG_DATABASE: "${DB_PG_DATABASE}"
      DB_PG_USERNAME: "${DB_PG_USERNAME}"
      DB_PG_PASSWORD: "${DB_PG_PASSWORD}"
      DB_PG_SCHEMA: "${DB_PG_SCHEMA:-public}"

      # ----------------------------------------------------------------
      # Modo demo (sin BD real)
      # ----------------------------------------------------------------
      DASHBOARD_DEMO: "${DASHBOARD_DEMO:-false}"

      # ----------------------------------------------------------------
      # Microservicio Whisper (transcripción)
      # ----------------------------------------------------------------
      WHISPER_SERVICE_URL: "${WHISPER_SERVICE_URL:-http://alfa_whisper:8002}"

      # ----------------------------------------------------------------
      # Microservicio PDF (fusión de PDF — PDF Tools)
      # ----------------------------------------------------------------
      PDF_SERVICE_URL: "${PDF_SERVICE_URL:-http://alfa_pdf:8003}"

      # ----------------------------------------------------------------
      # Microservicio Converter (Convertir a DocX — LibreOffice headless)
      # ----------------------------------------------------------------
      CONVERTER_SERVICE_URL: "${CONVERTER_SERVICE_URL:-http://alfa_converter:8004}"

      # ----------------------------------------------------------------
      # Opcache
      # ----------------------------------------------------------------
      PHP_OPCACHE_DEV: "${PHP_OPCACHE_DEV:-true}"

    networks:
      - alfa_network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - nlp
      - whisper
      - pdf
      - converter
      - postgres

  nlp:
    build:
      context: ./nlp_service
      dockerfile: Dockerfile
    image: alfa-nlp:latest
    container_name: alfa_nlp
    restart: unless-stopped
    ports:
      - "8001:8001"
    volumes:
      - ./nlp_service/main.py:/app/main.py:ro
    networks:
      - alfa_network

  # ── PostgreSQL — Blacklist y persistencia de entidades ─────────────────
  postgres:
    image: postgres:16-alpine
    container_name: alfa_postgres
    restart: unless-stopped
    ports:
      - "${PG_EXTERNAL_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: "${DB_PG_DATABASE:-alfa}"
      POSTGRES_USER: "${DB_PG_USERNAME:-alfa_user}"
      POSTGRES_PASSWORD: "${DB_PG_PASSWORD:-Alfa2026!Secure}"
    volumes:
      - ./docker/postgres-data:/var/lib/postgresql/data
    networks:
      - alfa_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  whisper:
    build:
      context: ./whisper_service
      dockerfile: Dockerfile
    image: alfa-whisper:latest
    container_name: alfa_whisper
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      WHISPER_MODEL: "${WHISPER_MODEL:-small}"
      MAX_FILE_SIZE_MB: "${MAX_FILE_SIZE_MB:-200}"
    volumes:
      - whisper_models:/root/.cache/whisper
    networks:
      - alfa_network

  pdf:
    build:
      context: ./pdf_service
      dockerfile: Dockerfile
    image: alfa-pdf:latest
    container_name: alfa_pdf
    restart: unless-stopped
    ports:
      - "8003:8003"
    environment:
      MAX_FILE_SIZE_MB: "${PDF_MAX_FILE_SIZE_MB:-100}"
      MAX_FILES: "${PDF_MAX_FILES:-30}"
    networks:
      - alfa_network

  # ── Converter — conversión de documentos a .docx (LibreOffice headless) ─
  converter:
    build:
      context: ./converter_service
      dockerfile: Dockerfile
    image: alfa-converter:latest
    container_name: alfa_converter
    restart: unless-stopped
    ports:
      - "8004:8004"
    environment:
      MAX_FILE_SIZE_MB: "${CONVERTER_MAX_FILE_SIZE_MB:-50}"
      SOFFICE_TIMEOUT: "${CONVERTER_SOFFICE_TIMEOUT:-120}"
    volumes:
      - ./converter_service/main.py:/app/main.py:ro
    networks:
      - alfa_network

volumes:
  dashboard_storage:
  vendor:
  node_modules:
  whisper_models:

networks:
  alfa_network:
    driver: bridge

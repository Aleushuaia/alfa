; Límites de subida para archivos multimedia (Transcriptor Whisper)
; Máximo 200 MB por archivo + margen para el multipart boundary
upload_max_filesize = 220M
post_max_size = 225M

; Tiempos de espera extendidos para transcripciones largas
max_execution_time = 660
max_input_time = 660
default_socket_timeout = 660

; Memoria suficiente para bufferear archivos grandes
memory_limit = 512M
